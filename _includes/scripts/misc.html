<!-- Reveal on scroll -->
<script>
(function () {
  var root = document.documentElement;
  try {
    if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      root.classList.remove('js');
      return;
    }
    var observer = new IntersectionObserver(function (entries) {
      var n = 0;
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var el = entry.target;
        // elements entering together animate one after another
        el.style.setProperty('--reveal-delay', (n++ * 70) + 'ms');
        el.classList.add('is-visible');
        observer.unobserve(el);
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -30px 0px' });
    document.querySelectorAll('.section, .section ol.bibliography > li, .reveal').forEach(function (el) {
      observer.observe(el);
    });
  } catch (e) {
    root.classList.remove('js');
  }
})();
</script>

<!-- News: glide down through older items, loop back to the newest; while hovered it becomes a normal scroll pane -->
<script>
(function () {
  var pane = document.querySelector('.news-scroller');
  if (!pane || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var list = pane.firstElementChild;
  var speed = 9;        // px per second
  var manual = false, offset = 0, last = null, holdUntil = performance.now() + 2500, rewind = null;
  function max() { return Math.max(0, list.offsetHeight - pane.clientHeight); }
  function place() { list.style.transform = 'translate3d(0,' + (-offset) + 'px,0)'; }
  function toManual() {          // hand over to native scrolling at the same position
    if (manual) return;
    manual = true; rewind = null;
    list.style.transform = '';
    pane.classList.add('is-manual');
    pane.scrollTop = offset;
  }
  function toAuto() {
    if (!manual) return;
    offset = pane.scrollTop;
    pane.scrollTop = 0;
    pane.classList.remove('is-manual');
    place();
    manual = false; last = null; holdUntil = performance.now() + 1200;
  }
  ['mouseenter', 'touchstart', 'focusin'].forEach(function (e) { pane.addEventListener(e, toManual, { passive: true }); });
  ['mouseleave', 'touchend', 'focusout'].forEach(function (e) { pane.addEventListener(e, toAuto, { passive: true }); });
  function step(now) {
    var dt = last === null ? 0 : Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!manual && now >= holdUntil) {
      if (rewind) {                                   // ease back to the newest item
        var t = Math.min(1, (now - rewind.start) / 1400);
        offset = rewind.from * (1 - (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2));
        if (t === 1) { rewind = null; holdUntil = now + 2500; }
      } else if (offset >= max()) {
        rewind = { start: now + 1500, from: offset }; holdUntil = now + 1500;
      } else {
        offset = Math.min(max(), offset + speed * dt);
      }
      place();
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
