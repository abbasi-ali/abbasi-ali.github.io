---
layout: default
---
<div class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-description">{{ page.description }}</p>
  </header>

  <article>
    {% if content contains '<div' or content contains '<section' %}
      {{ content }}
    {% else %}
      {% comment %} Plain markdown page: each h2 block becomes a tinted section {% endcomment %}
      {% assign tints = 'peach,butter,coral,apricot,sand,stone' | split: ',' %}
      {% assign chunks = content | split: '<h2' %}
      {% for chunk in chunks %}
        {% if forloop.first %}
          {{ chunk }}
        {% else %}
          {% assign t = forloop.index0 | minus: 1 | modulo: tints.size %}
          <section class="section tint-{{ tints[t] }}"><h2{{ chunk }}</section>
        {% endif %}
      {% endfor %}
    {% endif %}
  </article>

</div>
